<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Многоуровневый список</title>
</head>
<body>
    <h1>Разделы курса</h1>
    <ol>
        <li>Теги заголовков
            <ul type="a">
                <li>h1</li>
                <li>h2</li>
                <li>h3</li>
                <li>h4</li>
            </ul>
        </li>
        <li>Теги списков
            <ul type="square">
                <li>Упорядоченный список (ol)</li>
                <li>Неупорядоченный список (ul)</li>
            </ul>
        </li>
    </ol>
</body>
</html>
